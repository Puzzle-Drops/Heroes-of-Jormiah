<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0f0a2e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <rect width="325" height="600" fill="url(#g)"/>
  <rect width="325" height="600" fill="url(#vignette)"/>
  <rect x="6" y="6" width="313" height="588" fill="none" stroke="#0f0a2e" stroke-width="3"/>
  <rect x="12" y="12" width="301" height="576" fill="none" stroke="#e9d5ff" stroke-width="1" stroke-opacity="0.4"/>
  <!-- floating spire -->
  <g transform="translate(162.5,260)" fill="#c4b5fd" stroke="#0f0a2e" stroke-width="2.5">
    <polygon points="0,-130 -20,-65 -25,-50 -35,30 -25,75 -45,90 -50,95 -45,100 45,100 50,95 45,90 25,75 35,30 25,-50 20,-65"/>
    <!-- windows -->
    <rect x="-7" y="-50" width="14" height="22" fill="#1e1b4b"/>
    <rect x="-7" y="-15" width="14" height="22" fill="#1e1b4b"/>
    <rect x="-7" y="20" width="14" height="22" fill="#1e1b4b"/>
    <!-- floating island base -->
    <ellipse cx="0" cy="105" rx="55" ry="10" fill="#3b0764" stroke="none"/>
    <!-- crystal cap -->
    <polygon points="0,-160 -10,-130 10,-130" fill="#a5f3fc" stroke="#0f0a2e" stroke-width="2"/>
  </g>
  <!-- floating runes around tower -->
  <g fill="#a5f3fc" opacity="0.7">
    <circle cx="50" cy="200" r="3"/>
    <circle cx="285" cy="180" r="3"/>
    <circle cx="60" cy="320" r="3"/>
    <circle cx="280" cy="340" r="3"/>
    <circle cx="35" cy="150" r="2"/>
    <circle cx="295" cy="250" r="2"/>
  </g>
  <text x="162.5" y="445" text-anchor="middle" fill="#f5f3ff" font-family="Cinzel,Georgia,serif" font-size="20" font-weight="800" letter-spacing="2" stroke="#0f0a2e" stroke-width="0.6">THE WHISPERING</text>
  <text x="162.5" y="488" text-anchor="middle" fill="#f5f3ff" font-family="Cinzel,Georgia,serif" font-size="28" font-weight="800" letter-spacing="3" stroke="#0f0a2e" stroke-width="0.6">SPIRES</text>
  <text x="162.5" y="540" text-anchor="middle" fill="#e9d5ff" font-family="Georgia,serif" font-size="13" font-style="italic" opacity="0.85">floating arcane towers</text>
</svg>
