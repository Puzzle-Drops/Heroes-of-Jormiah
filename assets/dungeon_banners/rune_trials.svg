<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e4a"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#04102e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <rect width="325" height="600" fill="url(#g)"/>
  <rect width="325" height="600" fill="url(#vignette)"/>
  <rect x="6" y="6" width="313" height="588" fill="none" stroke="#04102e" stroke-width="3"/>
  <rect x="12" y="12" width="301" height="576" fill="none" stroke="#bfdbfe" stroke-width="1" stroke-opacity="0.4"/>
  <!-- runic stone tablet -->
  <g transform="translate(162.5,260)">
    <rect x="-70" y="-100" width="140" height="200" rx="6" fill="#1e3a8a" stroke="#bfdbfe" stroke-width="3"/>
    <!-- big rune (Algiz-like) -->
    <g stroke="#bfdbfe" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="80"/>
      <line x1="0" y1="-30" x2="-40" y2="-70"/>
      <line x1="0" y1="-30" x2="40" y2="-70"/>
    </g>
    <!-- little runes around -->
    <g stroke="#93c5fd" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
      <g transform="translate(-50,-80)">
        <line x1="-5" y1="-7" x2="-5" y2="7"/>
        <line x1="-5" y1="-7" x2="5" y2="0"/>
      </g>
      <g transform="translate(50,-80)">
        <line x1="0" y1="-7" x2="0" y2="7"/>
        <line x1="-5" y1="0" x2="5" y2="0"/>
      </g>
      <g transform="translate(-50,80)">
        <line x1="-5" y1="-7" x2="5" y2="7"/>
        <line x1="5" y1="-7" x2="-5" y2="7"/>
      </g>
      <g transform="translate(50,80)">
        <polygon points="0,-7 6,7 -6,7" fill="none"/>
      </g>
    </g>
  </g>
  <!-- glowing motes -->
  <g fill="#bfdbfe" opacity="0.6">
    <circle cx="40" cy="160" r="3"/>
    <circle cx="290" cy="180" r="3"/>
    <circle cx="50" cy="380" r="3"/>
    <circle cx="280" cy="360" r="3"/>
    <circle cx="35" cy="500" r="2"/>
    <circle cx="290" cy="490" r="2"/>
  </g>
  <text x="162.5" y="450" text-anchor="middle" fill="#dbeafe" font-family="Cinzel,Georgia,serif" font-size="24" font-weight="800" letter-spacing="2" stroke="#04102e" stroke-width="0.6">RUNE</text>
  <text x="162.5" y="490" text-anchor="middle" fill="#dbeafe" font-family="Cinzel,Georgia,serif" font-size="28" font-weight="800" letter-spacing="3" stroke="#04102e" stroke-width="0.6">TRIALS</text>
  <text x="162.5" y="540" text-anchor="middle" fill="#bfdbfe" font-family="Georgia,serif" font-size="13" font-style="italic" opacity="0.85">elite challenge · rune drops</text>
</svg>
